MEMORY {
    WSTUB:   start = $7EE1, size = $001F, file = "out/wstub.bin";
    FARCALL: start = $7FE7, size = $0018, file = "out/farcall.bin";
    B1:      start = $B770, size = $07E0, file = "out/b1.bin";
    B3:      start = $A000, size = $1F50, file = "out/b3.bin";
    B2:      start = $AFA0, size = $0200, file = "out/b2.bin";
    B4:      start = $B470, size = $0AE0, file = "out/b4.bin";
}
SEGMENTS {
    WSTUB:   load = WSTUB, type = ro;
    FARCALL: load = FARCALL, type = ro;
    B1CODE:  load = B1, type = ro;
    B3CODE:  load = B3, type = ro;
    B4CODE:  load = B4, type = ro;
    B2CODE:  load = B2, type = ro;
}
